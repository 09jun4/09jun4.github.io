<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shoot to Survive</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; opacity: .85; }
  #vignette { position: absolute; inset: 0; box-shadow: inset 0 0 140px 50px rgba(190,0,0,.95); opacity: 0; transition: opacity .8s ease-out; }
  #vignette.hit { opacity: 1; transition: none; }
  #left, #right { position: absolute; bottom: 18px; font-size: 18px; letter-spacing: 1px; text-shadow: 0 0 4px #000; }
  #left { left: 22px; } #right { right: 22px; text-align: right; }
  #hearts { color: #d33; font-size: 26px; letter-spacing: 3px; }
  #hearts i { font-style: normal; } #hearts i.off { color: #3a2a2a; }
  #count { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 20px; text-shadow: 0 0 4px #000; }
  #cyl { margin-top: 6px; display: none; gap: 6px; justify-content: flex-end; }
  #cyl b { width: 14px; height: 14px; border: 2px solid #aaa; border-radius: 50%; display: inline-block; }
  #cyl b.on { background: #e8c25a; border-color: #e8c25a; }
  #badge { position: absolute; top: 14px; right: 16px; font-size: 12px; letter-spacing: 2px; color: #7ad; display: none; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(0,0,0,.72); text-align: center; cursor: pointer; }
  .screen h1 { margin: 0; font-size: 42px; letter-spacing: 4px; font-weight: 600; }
  .screen p { margin: 0; font-size: 20px; opacity: .85; }
  .screen small { opacity: .5; line-height: 1.7; }
  .screen button { font: inherit; font-size: 20px; padding: 12px 28px; background: #000; color: #fff; border: 1px solid #aaa; cursor: pointer; }
  .screen button:hover { background: #fff; color: #000; }

  /* 모바일 터치 조작 */
  html, body { overscroll-behavior: none; }
  #stage { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #touch { position: absolute; inset: 0; pointer-events: none; --b: clamp(50px, 12vmin, 86px); }
  #joyBase { position: absolute; width: calc(var(--b) * 1.9); height: calc(var(--b) * 1.9); margin: calc(var(--b) * -0.95) 0 0 calc(var(--b) * -0.95); border: 2px solid rgba(255,255,255,.28); border-radius: 50%; background: rgba(255,255,255,.05); }
  #joyBase.on { border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.1); }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; transform: translate(-50%,-50%); border-radius: 50%; background: rgba(255,255,255,.35); }
  .tbtn { position: absolute; pointer-events: auto; width: var(--b); height: var(--b); border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.45); color: #fff; font: 600 calc(var(--b) * .22) ui-monospace, Menlo, monospace; padding: 0; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: none; }
  .tbtn.down { background: rgba(255,255,255,.4); }
  #bFire { right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: calc(var(--b) * 1.4); height: calc(var(--b) * 1.4); border-color: #e55; background: rgba(160,20,20,.5); font-size: calc(var(--b) * .28); }
  #bMelee { right: calc(var(--b) * 1.4 + 34px); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
  #bReload { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(var(--b) * 1.4 + 34px + env(safe-area-inset-bottom, 0px)); }
  #bSwitch { right: calc(var(--b) * 1.2 + 40px); bottom: calc(var(--b) * 1.2 + 44px + env(safe-area-inset-bottom, 0px)); }
  #bQ { left: calc(16px + env(safe-area-inset-left, 0px)); top: 40%; width: calc(var(--b) * .8); height: calc(var(--b) * .8); }
  #bE { right: calc(16px + env(safe-area-inset-right, 0px)); top: 40%; width: calc(var(--b) * .8); height: calc(var(--b) * .8); }
  body.touch-ui #left, body.touch-ui #right { bottom: auto; top: 38px; }

  /* 설정 메뉴 */
  .panel { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: min(360px, 86vw); text-align: left; cursor: default; }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 16px; }
  .set > span:first-child { white-space: nowrap; }
  .seg { display: flex; } .seg button { font-size: 15px; padding: 7px 18px; border-radius: 0; margin: 0 0 0 -1px; }
  .seg button.sel { background: #fff; color: #000; }
  .set input[type=range] { flex: 1; min-width: 120px; accent-color: #fff; } .set b { font-weight: 500; min-width: 3.2em; text-align: right; }
  .panel small { font-size: 12px; opacity: .55; line-height: 1.5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #hint { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); border: 1px solid #888; padding: 6px 12px; font-size: 13px; text-align: center; max-width: 88vw; }
  #menuBtn { display: none; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; font-size: 18px; }
  body.touch-ui #menuBtn { display: flex; } body.touch-ui #badge { right: 56px; }
  .hide { display: none !important; }
  @media (max-width: 640px) {
    .screen h1 { font-size: 26px; } .screen p { font-size: 16px; }
    #left, #right { font-size: 13px; bottom: 10px; } #left { left: 12px; } #right { right: 12px; }
    #hearts { font-size: 20px; } #count { font-size: 15px; top: 10px; } #badge { top: 10px; right: 10px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div id="hud">
  <div id="cross"></div><div id="vignette"></div>
  <div id="count"></div><div id="hint" class="hide"></div><div id="badge">AI AUTO PLAY</div>
  <div id="left"><div id="hearts"></div></div>
  <div id="right"><div id="equip"></div><div id="cyl"></div></div>
</div>
<div id="touch" class="hide">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button class="tbtn" id="bFire" type="button">발사</button>
    <button class="tbtn" id="bMelee" type="button">근접</button>
    <button class="tbtn" id="bReload" type="button">장전</button>
    <button class="tbtn" id="bSwitch" type="button">전환</button>
    <button class="tbtn" id="bQ" type="button">◀Q</button>
    <button class="tbtn" id="bE" type="button">E▶</button>
    <button class="tbtn" id="menuBtn" type="button">☰</button>
  </div>
<div id="title" class="screen"><h1>SHOOT TO SURVIVE</h1><p>클릭하여 시작</p>
  <div id="titleSettings" class="panel"></div>
  <button id="startBtn" type="button">시작하기</button>
  <small id="titleHelp">WASD 이동 · 마우스 시점 · 좌클릭 발사 · R 재장전 · V 근접공격<br>1 권총 / 2 손전등 / 휠 전환 · Q E 기울이기</small></div>
<div id="menu" class="screen hide" style="cursor:default"><h1>PAUSED</h1>
  <div id="menuSettings" class="panel"></div>
  <div class="row"><button id="resumeBtn" type="button">계속하기</button><button id="newMazeBtn" type="button">새 미로로 다시 시작</button></div>
  <small>Esc 키로 메뉴를 열고 닫아요</small></div>
<div id="end" class="screen hide" style="cursor:default"><h1 id="endTitle"></h1><p id="endText"></p><button id="restart">다시 시작</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
