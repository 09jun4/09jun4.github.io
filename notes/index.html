<html lang="ko">
<head>
<meta charset="utf-8">

<title>notes · 09jun4</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main class="wrap">
  <h1>notes</h1>
  <input class="search" id="q" type="search" placeholder="검색">
  <ul class="list" id="list"></ul>
</main>
<script src="../data/notes.js"></script>
<script src="../assets/site.js"></script>
<script>
  header('notes');
  const q = document.getElementById('q');
  const draw = () => { const s = q.value.trim().toLowerCase(); fill('list', NOTES.filter(n => !s || (n.title + ' ' + (n.desc || '')).toLowerCase().includes(s)).sort(byDate), noteRow, s ? '찾는 노트가 없어요' : '아직 없어요'); };
  q.oninput = draw; draw();
</script>
</body>
</html>
