<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="robots" content="noindex, nofollow">
<title>notes · 09jun4</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="./">← notes</a>
  <article id="body"><p class="empty">불러오는 중...</p></article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="../data/notes.js"></script>
<script src="../assets/site.js"></script>
<script>
  header('notes');
  const id = new URLSearchParams(location.search).get('id') || '', n = NOTES.find(x => x.id === id), body = document.getElementById('body');
  if (!n || !/^[a-z0-9_-]+$/i.test(id)) body.innerHTML = '<p class="empty">노트를 찾지 못했어요</p>';
  else fetch(id + '.md', { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.text(); }).then(md => {
    document.title = n.title + ' · 09jun4';
    body.innerHTML = '<h1>' + esc(n.title) + '</h1><p class="date">' + esc(n.date || '') + '</p>' + DOMPurify.sanitize(marked.parse(md));
  }).catch(() => { body.innerHTML = '<p class="empty">불러오지 못했어요</p>'; });
</script>
</body>
</html>
